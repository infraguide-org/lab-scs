# k3s
# proxy_env:
#   HTTP_PROXY: "http://{{ groups['manager'][0] }}:3128"
#   HTTPS_PROXY: "http://{{ groups['manager'][0] }}:3128"
#   # Due to the fact, that k8s is based on Golang supports CIDR blocks its a good idea to exclude local networks,
