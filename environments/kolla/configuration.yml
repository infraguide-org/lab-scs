---
##########################################################
# images

# Where the Kolla service images are pulled from. Nothing upstream emits a
# usable value for this: osism/defaults ships only the placeholder `kolla`, and
# the release pins do not set it at all. OSISM 10 introduced the versioned form,
# with the OpenStack release appended; the rolling development head is the
# exception and publishes to the plain namespace.
#
# The versioned form resolves openstack_version at Ansible time rather than
# baking it in here, because that is the same value the image tags are chosen
# from: for a pinned release it comes from the kolla-ansible container's own
# group_vars (rendered at image build time), not from this repository. Writing a
# literal would create two independent sources for one fact, and a namespace
# naming one series while the tags name another fails the pull.
docker_namespace: "kolla/release/{{ openstack_version }}"

##########################################################
# loadbalancer

kolla_internal_fqdn: int.os.lab.nfgd.net
kolla_external_fqdn: services.lab.nfgd.net

kolla_internal_vip_address: 10.20.8.35
kolla_external_vip_address: 10.34.10.35

# TODO
# kolla_enable_tls_internal: "yes"
# kolla_enable_tls_external: "yes"
kolla_enable_tls_internal: "no"
kolla_enable_tls_external: "no"

# kolla_copy_ca_into_containers: "yes"

##########################################################
# openstack

# generic
openstack_service_workers: 5

# elasticsearch
opensearch_heap_size: "4g"

# neutron
neutron_plugin_agent: "ovn"
neutron_ovn_availability_zones: [nova]
neutron_dns_domain: lab.nfgd.net.

# octavia
# TODO
# octavia_network_type: tenant

# designate
designate_ns_record: openstack.lab.nfgd.net

# ceilometer
# With ceilometer enabled, its polling agents serve their samples on this
# port and the Prometheus that OSISM deploys scrapes them. Uncomment to turn
# the export off or to move it to another port.
# enable_ceilometer_prometheus_exporter: "no"
# ceilometer_prometheus_exporter_port: "9181"
# A host that runs both the central and the compute agent needs one of them
# on another port; set it in that host's host_vars:
# ceilometer_central_prometheus_exporter_port: "9182"

# TODO: magnum needs access to internet
