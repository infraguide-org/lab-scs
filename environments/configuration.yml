---
##########################
# docker

docker_version: '5:27.5.1'
docker_user: "{{ operator_user }}"

##########################
# operator

operator_user: dragon

# yamllint disable rule:line-length
operator_public_key: ssh-rsa 
# yamllint enable rule:line-length

operator_authorized_keys:
  - "{{ operator_public_key }}"

##########################
# resolvconf

# DOCS: https://osism.tech/docs/guides/configuration-guide/commons/resolvconf
resolvconf_nameserver:
  - 9.9.9.9
  - 149.112.112.112
resolvconf_search: lab.nfgd.net

##########################
# hosts

hosts_additional_entries:
  int.os.lab.nfgd.net: 10.20.8.35
  services.lab.nfgd.net: 10.34.10.35

##########################
# chrony

# DOCS: https://osism.tech/docs/guides/configuration-guide/services/chrony
chrony_servers:
  - 0.de.pool.ntp.org
  - 1.de.pool.ntp.org
ceph_cluster_fsid: fce1d811-445c-42ba-aa04-39e45c584bfe
